# LiftZero Learning Regimes and Domain Randomisation Configuration
# Ground-truth definitions for Phase 3-7 learning environments and evaluations.

training:
  floors_min: 6
  floors_max: 40
  cars_min: 2
  cars_max: 8
  capacity_min: 6
  capacity_max: 16
  seconds_per_floor_min: 1
  seconds_per_floor_max: 3
  duration_min: 600
  duration_max: 1800
  rate_u_min: 0.6
  rate_u_max: 1.8
  priority_probability: 0.05
  disturbance_probability: 0.25

eval_regimes:
  up_peak:
    floors: 15
    cars: 4
    capacity: 10
    duration: 900
    rate: 0.20
    pattern: up_peak
    note: "morning rush"
  down_peak:
    floors: 15
    cars: 4
    capacity: 10
    duration: 900
    rate: 0.20
    pattern: down_peak
    note: "the regime where the current full strategy loses to collective"
  two_way:
    floors: 15
    cars: 4
    capacity: 10
    duration: 900
    rate: 0.18
    pattern: two_way
    note: "lunch rush"
  interfloor:
    floors: 15
    cars: 4
    capacity: 10
    duration: 900
    rate: 0.10
    pattern: interfloor
    note: "light mixed"

scale:
  large_40x8:
    floors: 40
    cars: 8
    capacity: 12
    duration: 900
    rate: 0.12
    pattern: two_way
  small_6x2:
    floors: 6
    cars: 2
    capacity: 8
    duration: 900
    rate: 0.15
    pattern: two_way

seeds:
  train_max: 7999
  val_start: 8000
  val_end: 8049
  test_start: 8500
  test_end: 8599
