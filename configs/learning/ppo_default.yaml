# LiftZero cooperative PPO — default preset (Kaggle: 4 CPU cores; rollouts are CPU-bound).
name: ppo_default
init: models/liftzero_bc_v1.ckpt.pt
total_decisions: 2000000
decisions_per_iter: 8192
workers: 3
epochs: 4
minibatch: 2048
clip: 0.2
c_value: 0.5
c_distill: 0.5
ent_start: 0.01
ent_end: 0.001
beta_start: 0.2
beta_end: 0.0
beta_frac: 0.6
lr_start: 3.0e-4
lr_end: 3.0e-5
grad_clip: 0.5
target_kl: 0.03
gamma: 0.99
tau: 5.0
lam: 0.95
reward_clip: 20.0
eval_every: 10
eval_seeds: 10
eval_strategy: liftzero_ppo
guard_pct: 10.0
seed: 0
