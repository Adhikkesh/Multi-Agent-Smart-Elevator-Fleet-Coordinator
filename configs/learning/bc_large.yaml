# LiftZero behaviour cloning — large preset (d=128) for the capacity ablation.
name: bc_large
data_train: [data/expert/train]
data_val: [data/expert/val]
max_val_decisions: 60000
epochs: 30
batch_size: 512
patience: 4
device: auto
seed: 0
model:
  d_model: 128
  n_layers: 4
  n_heads: 4
  ffn_mult: 4
  dropout: 0.05
