description: >
  One in six arrivals is a priority passenger (wheelchair user or VIP) carrying weight x3.
  Because the routing cost multiplies arrival time by passenger weight, a heavier
  passenger is served sooner without any special-case code — the utility function alone
  produces the priority behaviour.
